<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News Desk</title>
<meta name="description" content="Daily desk for startups and new ideas, AI, technology, economy, industry, politics and markets - Iran and world.">
<meta name="theme-color" content="#f7f5f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0; --panel: #ffffff; --ink: #1b1b1f; --ink-2: #3f3f46; --muted: #71717a; --line: #e8e4da; --hover: #f1eee6;
  --c-startups: #db2777; --c-ai: #7c3aed; --c-tech: #2563eb; --c-economy: #059669; --c-industry: #d97706;
  --c-politics: #dc2626; --c-markets: #64748b; --c-today: #1b1b1f; --c-fintech: #0891b2; --c-football: #65a30d; --c-events: #9333ea;
  --up: #059669; --down: #dc2626; --star: #f59e0b; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111114; --panel: #1a1a1f; --ink: #ececf1; --ink-2: #c8c8d0; --muted: #9a9aa5; --line: #2a2a31; --hover: #222229;
    --c-startups: #f472b6; --c-ai: #a78bfa; --c-tech: #60a5fa; --c-economy: #34d399; --c-industry: #fbbf24;
    --c-politics: #f87171; --c-markets: #94a3b8; --c-today: #ececf1; --c-fintech: #22d3ee; --c-football: #a3e635; --c-events: #c084fc; --up: #34d399; --down: #f87171; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #111114; --panel: #1a1a1f; --ink: #ececf1; --ink-2: #c8c8d0; --muted: #9a9aa5; --line: #2a2a31; --hover: #222229;
  --c-startups: #f472b6; --c-ai: #a78bfa; --c-tech: #60a5fa; --c-economy: #34d399; --c-industry: #fbbf24;
  --c-politics: #f87171; --c-markets: #94a3b8; --c-today: #ececf1; --c-fintech: #22d3ee; --c-football: #a3e635; --c-events: #c084fc; --up: #34d399; --down: #f87171; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
img { display: block; }
.fa, [dir="rtl"] { font-family: Vazirmatn, Tahoma, sans-serif; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
aside {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line);
  padding: 22px 14px; display: flex; flex-direction: column; gap: 2px; background: var(--bg);
}
.logo { display: flex; align-items: center; gap: 10px; padding: 0 10px 4px; }
.logo img { width: 30px; height: 30px; border-radius: 8px; }
.logo b { font-size: 17px; letter-spacing: -.01em; }
.today-date { color: var(--muted); font-size: 13px; padding: 0 10px 8px; }
.nav-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; }
.nav {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 9px; cursor: pointer;
  border: 0; background: none; width: 100%; text-align: left; font-size: 15px; font-weight: 500; color: var(--ink-2);
}
.nav:hover { background: var(--hover); }
.nav.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.nav .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.nav .n { margin-left: auto; font-size: 12px; font-weight: 600; color: #fff; background: var(--ink); border-radius: 10px; padding: 0 7px; }
.aside-foot { margin-top: auto; padding: 16px 10px 0; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 16px; height: 16px; }
main { min-width: 0; padding: 28px 36px 80px; max-width: 1240px; width: 100%; }

/* ---------- page header ---------- */
.ph { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.ph .kicker { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.ph h1 { font-family: Newsreader, Georgia, serif; font-weight: 600; font-size: 38px; line-height: 1.1; margin: 4px 0 6px; letter-spacing: -.01em; }
.ph p { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 640px; }
.ph .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search { width: 220px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 9px; padding: 8px 12px; font: inherit; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 7px 13px; font-size: 14px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--ink); color: var(--bg); }

/* ---------- story columns ---------- */
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
.cols2.single { grid-template-columns: minmax(0, 760px); }
.colhead { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); font-family: Inter, sans-serif; }
.colhead span { color: var(--muted); font-weight: 500; letter-spacing: 0; text-transform: none; }
.lead { display: block; background: var(--panel); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); margin-bottom: 14px; }
.lead .pic { display: block; aspect-ratio: 16 / 9; background: var(--hover); overflow: hidden; }
.lead .pic img { width: 100%; height: 100%; object-fit: cover; }
.lead .body { padding: 14px 18px 16px; }
.lead h2 { font-size: 23px; line-height: 1.35; margin: 6px 0 8px; font-weight: 600; }
.lead p { margin: 0; color: var(--ink-2); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.row { display: flex; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.row:last-child { border-bottom: 0; }
.row .txt { flex: 1; min-width: 0; }
.row h3 { font-size: 16.5px; line-height: 1.45; margin: 3px 0 4px; font-weight: 600; }
.row p { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .thumb { display: block; width: 112px; height: 78px; border-radius: 9px; overflow: hidden; flex: none; background: var(--hover); }
.row .thumb img { width: 100%; height: 100%; object-fit: cover; }
.serif-h { font-family: Newsreader, Georgia, serif; }
[dir="rtl"] .serif-h { font-family: Vazirmatn, Tahoma, sans-serif; }
.meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); font-family: Inter, Vazirmatn, sans-serif; }
.meta .src { font-weight: 600; color: var(--ink-2); }
.newdot { width: 7px; height: 7px; border-radius: 50%; background: var(--up); display: inline-block; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 5px; background: var(--hover); color: var(--ink-2); }
.tag.funding { background: rgba(5,150,105,.12); color: var(--up); }
.tag.launch { background: rgba(219,39,119,.12); color: var(--c-startups); }
.story h2:hover, .story h3:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.story.read h2, .story.read h3 { color: var(--muted); }
.star { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 2px; margin-left: auto; opacity: .55; }
[dir="rtl"] .star { margin-left: 0; margin-right: auto; }
.star:hover, .star.on { opacity: 1; }
.star.on { color: var(--star); }
.star svg { width: 17px; height: 17px; display: block; }
.more { display: block; width: 100%; margin-top: 12px; padding: 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 14px; color: var(--ink-2); }
.empty { color: var(--muted); padding: 30px 6px; text-align: center; font-size: 14.5px; }

/* ---------- today ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
.brief-hl { font-size: 24px; line-height: 1.6; font-weight: 600; margin: 6px 0 0; }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.idea { border-top: 4px solid var(--c-startups); }
.idea h3 { margin: 0 0 8px; font-size: 18px; line-height: 1.5; }
.idea dl { margin: 0; display: grid; gap: 6px; font-size: 14.5px; line-height: 1.8; }
.idea dt { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-family: Inter, sans-serif; }
.idea dd { margin: 0 0 4px; color: var(--ink-2); }
.refs { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; }
.refs a { font-size: 12.5px; color: var(--c-tech); font-family: Inter, sans-serif; }
.refs a:hover { text-decoration: underline; }
.sec-title { display: flex; align-items: center; gap: 10px; margin: 34px 0 12px; }
.sec-title h2 { margin: 0; font-size: 22px; font-family: Newsreader, Georgia, serif; font-weight: 600; }
.sec-title .bar { width: 4px; height: 22px; border-radius: 2px; }
.sec-title a { margin-left: auto; font-size: 13.5px; color: var(--muted); font-weight: 500; cursor: pointer; }
.sec-title a:hover { color: var(--ink); }
.bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.bsec h3 { margin: 0 0 10px; font-size: 14px; display: flex; gap: 8px; align-items: center; font-family: Inter, sans-serif; }
.bsec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.bsec li { line-height: 1.85; font-size: 15px; }
.pill { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 5px; color: #fff; font-family: Inter, sans-serif; }
.pill.iran { background: #0f766e; } .pill.world { background: #4338ca; }
.front { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.mini { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.mini .pic { aspect-ratio: 16 / 10; background: var(--hover); overflow: hidden; }
.mini .pic img { width: 100%; height: 100%; object-fit: cover; }
.mini .body { padding: 10px 12px 12px; }
.mini h3 { font-size: 15.5px; line-height: 1.45; margin: 5px 0 0; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mini:hover h3 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.notice { border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; color: var(--muted); font-size: 14px; }

/* ---------- markets ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .k { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.kpi .v { font-size: 23px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em; }
.kpi .c { font-size: 13px; margin-top: 2px; font-weight: 600; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th, td { text-align: left; padding: 9px 4px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.note { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 500; }
.tablewrap { overflow-x: auto; }
.card h3.t { margin: 0 0 6px; font-size: 15px; }
.foot { color: var(--muted); font-size: 13px; margin-top: 22px; line-height: 1.7; }
.ok { color: var(--up); } .err { color: var(--down); }

/* ---------- calendar ---------- */
.cal { margin: 18px 4px 0; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-size: 12px; }
.cal-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 6px; }
.cal-h b { font-size: 13px; }
.cal-h span { color: var(--muted); font-size: 11px; }
.cal-today { font-size: 11.5px; color: var(--ink-2); margin-bottom: 8px; line-height: 1.5; }
.cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-g .wd { font-size: 10px; color: var(--muted); font-weight: 600; padding-bottom: 2px; }
.cal-g .d { padding: 3px 0 2px; border-radius: 6px; line-height: 1.1; position: relative; cursor: default; }
.cal-g .d b { display: block; font-size: 12px; font-weight: 600; }
.cal-g .d i { display: block; font-style: normal; font-size: 9px; color: var(--muted); }
.cal-g .d.fri b { color: var(--down); }
.cal-g .d.now { background: var(--ink); }
.cal-g .d.now b, .cal-g .d.now i { color: var(--bg); }
.cal-g .d.ev { cursor: pointer; }
.cal-g .d.ev::after { content: ""; position: absolute; left: 50%; bottom: -1px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--c-events); }
.datebar { display: none; color: var(--muted); font-size: 13px; margin-bottom: 10px; }

/* ---------- events ---------- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ev-row { display: flex; gap: 16px; padding: 14px 4px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.ev-row:last-child { border-bottom: 0; }
.ev-date { width: 66px; flex: none; text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 0; background: var(--panel); }
.ev-date .dd { font-size: 22px; font-weight: 700; line-height: 1.1; }
.ev-date .mm { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ev-date .jj { font-size: 10.5px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 4px; padding-top: 3px; }
.ev-row.high .ev-date { border-color: var(--c-events); box-shadow: inset 0 0 0 1px var(--c-events); }
.ev-body { flex: 1; min-width: 0; }
.ev-body h3 { margin: 4px 0 4px; font-size: 16.5px; line-height: 1.5; }
.ev-body p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.8; }
.ev-body a.src { font-size: 12.5px; color: var(--c-tech); font-family: Inter, sans-serif; }
.cat { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 5px; background: var(--hover); color: var(--ink-2); text-transform: capitalize; }
.upcoming { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.upcoming .card { padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.upcoming .ev-date { width: 54px; padding: 4px 0; }
.upcoming .ev-date .dd { font-size: 18px; }
.upcoming h4 { margin: 0; font-size: 14px; line-height: 1.6; font-weight: 600; }
.idea .ex { background: var(--hover); border-radius: 9px; padding: 8px 10px; margin: 0 0 10px; font-size: 13.5px; line-height: 1.8; color: var(--ink-2); }
.idea .ex b { color: var(--ink); }
.idea .area { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c-startups); font-family: Inter, sans-serif; }
.idea.fintech { border-top-color: var(--c-fintech); }
.idea.fintech .area { color: var(--c-fintech); }
.topic-brief { margin-bottom: 26px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) { .front { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; align-content: start; }
  aside {
    position: sticky; top: 0; z-index: 10; height: auto; flex-direction: row; align-items: center; overflow-x: auto;
    border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; gap: 4px; scrollbar-width: none;
  }
  aside::-webkit-scrollbar { display: none; }
  .logo b, .today-date, .nav-label, .aside-foot span, .cal { display: none; }
  .datebar { display: block; }
  .logo { padding: 0 6px 0 0; }
  .nav { width: auto; white-space: nowrap; padding: 7px 11px; font-size: 14px; }
  .nav .n { margin-left: 4px; }
  .aside-foot { margin: 0; padding: 0 0 0 6px; }
  main { padding: 18px 16px 70px; }
  .ph h1 { font-size: 30px; }
  .ph .tools { margin-left: 0; width: 100%; }
  .search { flex: 1; width: auto; min-width: 0; }
  .cols2, .bgrid, .tgrid { grid-template-columns: 1fr; gap: 26px; }
}
@media (max-width: 560px) {
  .front { grid-template-columns: 1fr 1fr; gap: 10px; }
  .mini h3 { font-size: 14px; }
  .row .thumb { width: 88px; height: 66px; }
  .lead h2 { font-size: 20px; }
  .kpi .v { font-size: 19px; }
}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<script>
(function () {
  "use strict";
  var TOPICS = [
    { id: "startups", label: "Startups & Ideas", desc: "New companies, funding rounds, product launches and business ideas." },
    { id: "fintech", label: "Fintech", desc: "Payments, digital banking, lending, insurance tech and crypto - and the business ideas they suggest." },
    { id: "ai", label: "AI", desc: "Artificial intelligence: new models, products, companies, research and policy." },
    { id: "tech", label: "Technology", desc: "Gadgets, software, internet and the tech industry beyond AI." },
    { id: "economy", label: "Economy", desc: "Markets, money, trade, business and economic policy." },
    { id: "industry", label: "Industry", desc: "Manufacturing, energy, oil and gas, mining and supply chains." },
    { id: "politics", label: "Politics", desc: "World affairs and Iran's politics and foreign relations, from the major international outlets." },
    { id: "football", label: "European Football", desc: "Premier League, La Liga, Serie A, Bundesliga, Champions League: results, transfers and stories." }
  ];
  var TOPIC_BRIEF = {
    startups: ["startups_world", "startups_iran"], fintech: ["fintech_world", "fintech_iran"], ai: ["ai"], tech: ["tech"],
    economy: ["economy_world", "economy_iran"], industry: ["industry"], politics: ["politics_world", "politics_iran"], football: ["football"]
  };
  var EV_CATS = ["all", "politics", "economy", "markets", "tech", "startups", "sports", "culture", "holiday"];
  var TOPIC = {}; TOPICS.forEach(function (t) { TOPIC[t.id] = t; });
  var BRIEF_SECTIONS = [
    { key: "startups_world", topic: "startups", region: "world" }, { key: "startups_iran", topic: "startups", region: "iran" },
    { key: "fintech_world", topic: "fintech", region: "world" }, { key: "fintech_iran", topic: "fintech", region: "iran" },
    { key: "ai", topic: "ai" }, { key: "tech", topic: "tech" },
    { key: "economy_world", topic: "economy", region: "world" }, { key: "economy_iran", topic: "economy", region: "iran" },
    { key: "industry", topic: "industry" },
    { key: "politics_world", topic: "politics", region: "world" }, { key: "politics_iran", topic: "politics", region: "iran" },
    { key: "football", topic: "football" }
  ];
  var PAGE = 15;
  var FA = new RegExp("[" + String.fromCharCode(0x600) + "-" + String.fromCharCode(0x6FF) + "]");
  var ELLIPSIS = String.fromCharCode(0x2026);

  function load(key, fallback) {
    try { var v = localStorage.getItem("nd2." + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  }
  function save(key, value) { try { localStorage.setItem("nd2." + key, JSON.stringify(value)); } catch (e) { /* ignore */ } }

  var state = {
    view: load("view", "today"), region: load("region", "both"), unit: load("unit", "rial"), q: "",
    limit: { iran: PAGE, world: PAGE }, read: load("read", {}), saved: load("saved", {}),
    lastVisit: load("lastVisit", null), news: null, digest: null, markets: null, events: null, evCat: "all"
  };
  var thisVisit = new Date().toISOString();
  if (!state.lastVisit) state.lastVisit = new Date(Date.now() - 12 * 3600 * 1000).toISOString();

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function isFa(s) { return FA.test(s || ""); }
  function dirOf(s) { return isFa(s) ? ' dir="rtl"' : ' dir="ltr"'; }
  function ago(iso) {
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }
  function color(topic) { return "var(--c-" + topic + ")"; }
  function isNew(it) { return it.date > state.lastVisit && !state.read[it.id]; }
  function inTopic(it, t) { return (it.topics || []).indexOf(t) > -1; }
  function img(src) {
    return '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(src) + '" alt="" onerror="this.parentNode.style.display=\'none\'">';
  }
  var STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z"/></svg>';
  var STAR_O = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z"/></svg>';
  var ICONS = {
    today: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
    markets: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
    saved: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
    events: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    sources: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5"/></svg>'
  };

  function metaHtml(it) {
    var tags = (it.tags || []).map(function (t) { return '<span class="tag ' + t + '">' + t + "</span>"; }).join("");
    return '<div class="meta">' + (isNew(it) ? '<span class="newdot" title="New since your last visit"></span>' : "") +
      '<span class="src">' + esc(it.source) + "</span><span>&middot;</span><span>" + ago(it.date) + "</span>" + tags +
      '<button class="star' + (state.saved[it.id] ? " on" : "") + '" data-star="' + it.id + '" title="Save" aria-label="Save">' + (state.saved[it.id] ? STAR : STAR_O) + "</button></div>";
  }
  function leadHtml(it) {
    return '<article class="story lead' + (state.read[it.id] ? " read" : "") + '"' + dirOf(it.title) + ">" +
      (it.image ? '<a class="pic" href="' + esc(it.link) + '" target="_blank" rel="noopener" data-id="' + it.id + '">' + img(it.image) + "</a>" : "") +
      '<div class="body">' + metaHtml(it) +
      '<a href="' + esc(it.link) + '" target="_blank" rel="noopener" data-id="' + it.id + '"><h2 class="serif-h">' + esc(it.title) + "</h2></a>" +
      (it.summary ? "<p>" + esc(it.summary) + "</p>" : "") + "</div></article>";
  }
  function rowHtml(it) {
    return '<article class="story row' + (state.read[it.id] ? " read" : "") + '"' + dirOf(it.title) + '><div class="txt">' + metaHtml(it) +
      '<a href="' + esc(it.link) + '" target="_blank" rel="noopener" data-id="' + it.id + '"><h3 class="serif-h">' + esc(it.title) + "</h3></a>" +
      (it.summary ? "<p>" + esc(it.summary) + "</p>" : "") + "</div>" +
      (it.image ? '<a class="thumb" href="' + esc(it.link) + '" target="_blank" rel="noopener" data-id="' + it.id + '">' + img(it.image) + "</a>" : "") +
      "</article>";
  }
  function miniHtml(it) {
    return '<a class="story mini" href="' + esc(it.link) + '" target="_blank" rel="noopener" data-id="' + it.id + '"' + dirOf(it.title) + ">" +
      (it.image ? '<div class="pic">' + img(it.image) + "</div>" : "") +
      '<div class="body"><div class="meta"><span class="pill ' + it.region + '">' + (it.region === "iran" ? "Iran" : "World") + "</span>" +
      '<span class="src">' + esc(it.source) + "</span><span>&middot;</span><span>" + ago(it.date) + "</span></div>" +
      '<h3 class="serif-h">' + esc(it.title) + "</h3></div></a>";
  }

  // ---------- calendars ----------
  var J_FMT = new Intl.DateTimeFormat("en-u-ca-persian-nu-latn", { year: "numeric", month: "numeric", day: "numeric" });
  var J_MONTH = new Intl.DateTimeFormat("en-u-ca-persian-nu-latn", { month: "long" });
  function jparts(d) {
    var o = {};
    J_FMT.formatToParts(d).forEach(function (p) { if (p.type === "year" || p.type === "month" || p.type === "day") o[p.type] = parseInt(p.value, 10); });
    return { y: o.year, m: o.month, d: o.day, name: J_MONTH.format(d) };
  }
  function ymd(d) {
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function parseYmd(s) { var a = s.split("-"); return new Date(+a[0], +a[1] - 1, +a[2]); }
  function jLabel(d) { var j = jparts(d); return j.d + " " + j.name + " " + j.y; }
  function eventDays() {
    var map = {};
    ((state.events && state.events.events) || []).forEach(function (e) {
      var a = parseYmd(e.date), b = e.end_date ? parseYmd(e.end_date) : a;
      for (var d = new Date(a); d <= b && (d - a) < 40 * 86400000; d.setDate(d.getDate() + 1)) map[ymd(d)] = 1;
    });
    return map;
  }
  function calendarHtml() {
    var today = new Date(); today.setHours(12, 0, 0, 0);
    var tj = jparts(today);
    var first = new Date(today); first.setDate(first.getDate() - (tj.d - 1));
    var days = [], d = new Date(first);
    while (jparts(d).m === tj.m && days.length < 31) { days.push(new Date(d)); d.setDate(d.getDate() + 1); }
    var last = days[days.length - 1];
    var gFirst = first.toLocaleDateString("en-US", { month: "short" }), gLast = last.toLocaleDateString("en-US", { month: "short", year: "numeric" });
    var ev = eventDays();
    var html = '<div class="cal"><div class="cal-h"><b>' + tj.name + " " + tj.y + "</b><span>" + (gFirst === last.toLocaleDateString("en-US", { month: "short" }) ? gLast : gFirst + " - " + gLast) + "</span></div>" +
      '<div class="cal-today">' + today.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + "</div>" +
      '<div class="cal-g">' + ["Sa", "Su", "Mo", "Tu", "We", "Th", "Fr"].map(function (w) { return '<div class="wd">' + w + "</div>"; }).join("");
    var lead = (first.getDay() + 1) % 7;
    for (var i = 0; i < lead; i++) html += "<div></div>";
    days.forEach(function (x) {
      var key = ymd(x), cls = "d" + (x.getDay() === 5 ? " fri" : "") + (key === ymd(today) ? " now" : "") + (ev[key] ? " ev" : "");
      html += '<div class="' + cls + '"' + (ev[key] ? ' data-view="events" title="Events on this day"' : "") + "><b>" + jparts(x).d + "</b><i>" + x.getDate() + "</i></div>";
    });
    return html + "</div></div>";
  }
  function dateBlock(e) {
    var d = parseYmd(e.date), j = jparts(d);
    return '<div class="ev-date"><div class="mm">' + d.toLocaleDateString("en-US", { month: "short" }) + '</div><div class="dd">' + d.getDate() +
      '</div><div class="mm">' + d.toLocaleDateString("en-US", { weekday: "short" }) + '</div><div class="jj">' + j.d + " " + j.name + "</div></div>";
  }
  function upcoming(days) {
    var now = ymd(new Date()), until = ymd(new Date(Date.now() + days * 86400000));
    return ((state.events && state.events.events) || []).filter(function (e) {
      return (e.end_date || e.date) >= now && e.date <= until;
    });
  }
  function renderEvents() {
    var html = '<header class="ph"><div><div class="kicker" style="color:' + color("events") + '">Calendar</div><h1>World events</h1>' +
      "<p>Important scheduled events, ceremonies and holidays in the coming weeks - politics, economy, tech, sport and culture, in Iran and worldwide. Researched weekly with web search.</p></div></header>";
    if (!state.events) return html + '<div class="notice">The events calendar starts once the site runs on GitHub with the Claude API key; it is refreshed every Monday.</div>';
    html += '<div class="chips" style="margin-bottom:16px">' + EV_CATS.map(function (c) {
      return '<button class="chip' + (state.evCat === c ? " on" : "") + '" data-evcat="' + c + '">' + (c === "all" ? "All" : c.charAt(0).toUpperCase() + c.slice(1)) + "</button>";
    }).join("") + "</div>";
    var list = upcoming(60).filter(function (e) { return state.evCat === "all" || e.category === state.evCat; });
    if (!list.length) return html + '<div class="empty">No events in this category.</div>';
    var lastMonth = null, body = "";
    list.forEach(function (e) {
      var m = parseYmd(e.date).toLocaleDateString("en-US", { month: "long", year: "numeric" });
      if (m !== lastMonth) { body += (lastMonth ? "</div>" : "") + sectionTitle(m, color("events")) + '<div class="card" style="padding:4px 18px">'; lastMonth = m; }
      var end = e.end_date && e.end_date !== e.date ? " &ndash; until " + parseYmd(e.end_date).toLocaleDateString("en-US", { day: "numeric", month: "short" }) : "";
      body += '<div class="ev-row' + (e.importance === "high" ? " high" : "") + '">' + dateBlock(e) + '<div class="ev-body"' + dirOf(e.title) + ">" +
        '<div class="meta"><span class="pill ' + e.region + '">' + (e.region === "iran" ? "Iran" : "World") + '</span><span class="cat">' + esc(e.category) + "</span>" + (end ? "<span>" + end + "</span>" : "") + "</div>" +
        "<h3>" + esc(e.title) + "</h3><p>" + esc(e.why) + "</p>" + (e.url ? '<a class="src" href="' + esc(e.url) + '" target="_blank" rel="noopener" dir="ltr">Source</a>' : "") + "</div></div>";
    });
    return html + body + "</div>";
  }

  // ---------- sidebar ----------
  function renderSide() {
    var items = state.news ? state.news.items : [];
    function nav(id, label, dot, n, icon) {
      return '<button class="nav' + (state.view === id ? " on" : "") + '" data-view="' + id + '">' +
        (icon || '<span class="dot" style="background:' + dot + '"></span>') + "<span>" + label + "</span>" +
        (n ? '<span class="n" title="New since your last visit">' + n + "</span>" : "") + "</button>";
    }
    var html = '<div class="logo"><img src="icon.svg" alt=""><b>News Desk</b></div>' +
      '<div class="today-date">' + new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }) + "</div>" +
      nav("today", "Today", null, 0, ICONS.today) + '<div class="nav-label">Topics</div>';
    TOPICS.forEach(function (t) {
      var n = items.filter(function (it) { return inTopic(it, t.id) && isNew(it); }).length;
      html += nav(t.id, t.label, color(t.id), n);
    });
    html += '<div class="nav-label">More</div>' + nav("events", "World events", null, 0, ICONS.events) + nav("markets", "Markets", null, 0, ICONS.markets) +
      nav("saved", "Saved", null, Object.keys(state.saved).length, ICONS.saved) + nav("sources", "Sources", null, 0, ICONS.sources) + calendarHtml();
    html += '<div class="aside-foot"><button class="iconbtn" id="reload" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>' +
      '<button class="iconbtn" id="theme" title="Light / dark" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>' +
      "<span>" + (state.news ? "Updated " + ago(state.news.generated) : "Loading" + ELLIPSIS) + "</span></div>";
    document.getElementById("side").innerHTML = html;
  }

  // ---------- topic page ----------
  function column(region, list) {
    var shown = list.slice(0, state.limit[region]);
    var leadIdx = 0;
    for (var i = 0; i < Math.min(4, shown.length); i++) if (shown[i].image) { leadIdx = i; break; }
    var html = '<section><div class="colhead">' + (region === "iran" ? "Iran" : "World") + "<span>" + list.length + " stories</span></div>";
    if (!list.length) return html + '<div class="empty">No stories here right now.</div></section>';
    html += leadHtml(shown[leadIdx]);
    shown.forEach(function (it, i) { if (i !== leadIdx) html += rowHtml(it); });
    if (list.length > shown.length) html += '<button class="more" data-more="' + region + '">Show more (' + (list.length - shown.length) + ")</button>";
    return html + "</section>";
  }
  function renderTopic(t) {
    var q = state.q.trim().toLowerCase();
    var all = state.news.items.filter(function (it) {
      return inTopic(it, t.id) && (!q || (it.title + " " + it.summary + " " + it.source).toLowerCase().indexOf(q) > -1);
    });
    var iran = all.filter(function (it) { return it.region === "iran"; });
    var world = all.filter(function (it) { return it.region === "world"; });
    var srcs = state.news.sources.filter(function (s) { return s.topic === t.id; }).map(function (s) { return s.name; });
    var html = '<header class="ph"><div><div class="kicker" style="color:' + color(t.id) + '">Topic</div><h1>' + t.label + "</h1><p>" + t.desc +
      " Sources: " + esc(srcs.join(", ")) + ".</p></div>" +
      '<div class="tools"><input class="search" id="q" type="search" placeholder="Search ' + esc(t.label) + '" value="' + esc(state.q) + '">' +
      '<div class="seg">' + ["both", "world", "iran"].map(function (r) {
        return '<button data-region="' + r + '" class="' + (state.region === r ? "on" : "") + '">' + { both: "Both", world: "World", iran: "Iran" }[r] + "</button>";
      }).join("") + "</div></div></header>";
    if (!q) html += topicBrief(t);
    if (state.region === "both") html += '<div class="cols2">' + column("world", world) + column("iran", iran) + "</div>";
    else html += '<div class="cols2 single">' + column(state.region, state.region === "iran" ? iran : world) + "</div>";
    return html;
  }

  // ---------- today ----------
  function refsHtml(links) {
    return (links || []).map(function (l) {
      return '<a href="' + esc(l.link) + '" target="_blank" rel="noopener" title="' + esc(l.title) + '">' + esc(l.source) + "</a>";
    }).join("");
  }
  function bullets(list) {
    return "<ul>" + list.map(function (x) {
      var refs = refsHtml(x.links);
      return "<li><div" + dirOf(x.text) + ">" + esc(x.text) + "</div>" + (refs ? '<div class="refs" dir="ltr">' + refs + "</div>" : "") + "</li>";
    }).join("") + "</ul>";
  }
  function sectionTitle(label, c, link) {
    return '<div class="sec-title"><span class="bar" style="background:' + c + '"></span><h2>' + label + "</h2>" +
      (link ? '<a data-view="' + link + '">See all &rarr;</a>' : "") + "</div>";
  }
  function frontPage() {
    var html = "";
    TOPICS.forEach(function (t) {
      var list = state.news.items.filter(function (it) { return inTopic(it, t.id); });
      var pick = [];
      ["world", "iran"].forEach(function (r) {
        var rl = list.filter(function (it) { return it.region === r; });
        var chosen = rl.slice(0, 8).filter(function (it) { return it.image; }).slice(0, 2);
        rl.forEach(function (it) { if (chosen.length < 2 && chosen.indexOf(it) < 0) chosen.push(it); });
        pick = pick.concat(chosen);
      });
      if (!pick.length) return;
      html += sectionTitle(t.label, color(t.id), t.id) + '<div class="front">' + pick.slice(0, 4).map(miniHtml).join("") + "</div>";
    });
    return html;
  }
  function ideasHtml(ideas) {
    return '<div class="ideas">' + ideas.map(function (x) {
      var refs = refsHtml(x.links);
      return '<div class="card idea ' + esc(x.area || "") + '"' + dirOf(x.title) + '><div class="area" dir="ltr">' + esc(x.area || "idea") + "</div><h3>" + esc(x.title) + "</h3>" +
        (x.example_company ? '<div class="ex"><b dir="ltr">' + esc(x.example_company) + "</b> &mdash; " + esc(x.example) + "</div>" : "") +
        "<dl><dt>The idea</dt><dd>" + esc(x.what) + "</dd><dt>Why now</dt><dd>" + esc(x.why_now) + "</dd>" +
        "<dt>In Iran</dt><dd>" + esc(x.iran_angle) + "</dd></dl>" + (refs ? '<div class="refs" dir="ltr">' + refs + "</div>" : "") + "</div>";
    }).join("") + "</div>";
  }
  function topicBrief(t) {
    var b = state.digest && state.digest.brief;
    if (!b) return "";
    var html = "";
    var ideas = (b.ideas || []).filter(function (x) { return x.area === t.id || (t.id === "startups" && x.area === "general"); });
    if (ideas.length) html += sectionTitle("Ideas from today's news", color(t.id)) + ideasHtml(ideas);
    var keys = (TOPIC_BRIEF[t.id] || []).filter(function (k) { return ((b.sections || {})[k] || []).length; });
    if (keys.length) {
      html += sectionTitle("Today's brief", color(t.id)) + '<div class="bgrid">' + keys.map(function (k) {
        var region = k.slice(-5) === "_iran" ? "iran" : (k.slice(-6) === "_world" ? "world" : "");
        return '<div class="card bsec" style="border-top:3px solid ' + color(t.id) + '">' +
          (region ? '<h3><span class="pill ' + region + '">' + (region === "iran" ? "Iran" : "World") + "</span></h3>" : "") + bullets(b.sections[k]) + "</div>";
      }).join("") + "</div>";
    }
    return html ? '<div class="topic-brief">' + html + "</div>" : "";
  }
  function renderToday() {
    var d = state.digest;
    var html = '<header class="ph"><div><div class="kicker" style="color:var(--muted)">' +
      new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" }) +
      "</div><h1>Today</h1><p>The day's brief, business ideas drawn from the news, and the top stories in every topic.</p></div></header>";
    if (d && d.brief) {
      var b = d.brief;
      html += '<div class="card"><div class="meta"><span class="src">Daily brief</span><span>&middot;</span><span>' + ago(d.generated) + "</span><span>&middot;</span><span>" + d.items_considered + " stories read</span></div>" +
        '<p class="brief-hl"' + dirOf(b.headline) + ">" + esc(b.headline) + "</p></div>";
      if (b.ideas && b.ideas.length) {
        html += sectionTitle("Idea radar", color("startups")) + ideasHtml(b.ideas);
      }
      if (b.top && b.top.length) html += sectionTitle("Top stories", "var(--c-today)") + '<div class="card bsec">' + bullets(b.top) + "</div>";
      var secs = BRIEF_SECTIONS.filter(function (s) { return ((b.sections || {})[s.key] || []).length; });
      if (secs.length) {
        html += sectionTitle("Brief by topic", "var(--muted)") + '<div class="bgrid">' + secs.map(function (s) {
          return '<div class="card bsec" style="border-top:3px solid ' + color(s.topic) + '"><h3>' + TOPIC[s.topic].label +
            (s.region ? '<span class="pill ' + s.region + '">' + (s.region === "iran" ? "Iran" : "World") + "</span>" : "") + "</h3>" + bullets(b.sections[s.key]) + "</div>";
        }).join("") + "</div>";
      }
      if (b.watch) html += sectionTitle("Worth watching", "var(--c-markets)") + '<div class="card"><div' + dirOf(b.watch) + ' style="line-height:1.9">' + esc(b.watch) + "</div></div>";
    } else {
      html += '<div class="notice">The written daily brief and the idea radar start once the site runs on GitHub with the Claude API key. Below are the latest stories from every topic.</div>';
    }
    var soon = upcoming(7);
    if (soon.length) {
      html += sectionTitle("Coming up this week", color("events"), "events") + '<div class="upcoming">' + soon.slice(0, 8).map(function (e) {
        return '<div class="card" data-view="events">' + dateBlock(e) + "<div" + dirOf(e.title) + '><div class="meta"><span class="cat">' + esc(e.category) + "</span></div><h4>" + esc(e.title) + "</h4></div></div>";
      }).join("") + "</div>";
    }
    return html + frontPage();
  }

  // ---------- markets ----------
  function chg(c, suffix) {
    if (c === null || c === undefined) return '<span class="flat">&ndash;</span>';
    var cls = c > 0 ? "up" : (c < 0 ? "down" : "flat");
    return '<span class="' + cls + '">' + (c > 0 ? "+" : "") + Number(c).toFixed(2) + "%" + (suffix || "") + "</span>";
  }
  function fmt(n, digits) {
    if (n === null || n === undefined) return "&ndash;";
    return Number(n).toLocaleString("en-US", { maximumFractionDigits: digits === undefined ? 2 : digits });
  }
  function irr(toman) { return toman === null || toman === undefined ? "&ndash;" : fmt(state.unit === "rial" ? toman * 10 : toman, 0); }
  function renderMarkets() {
    var m = state.markets;
    var html = '<header class="ph"><div><div class="kicker" style="color:' + color("markets") + '">Markets</div><h1>Prices</h1>' +
      "<p>Iran's open-market rates, coins and gold, the Tehran Stock Exchange, oil, and world markets.</p></div>" +
      '<div class="tools"><div class="seg"><button data-unit="rial" class="' + (state.unit === "rial" ? "on" : "") + '">Rial</button>' +
      '<button data-unit="toman" class="' + (state.unit === "toman" ? "on" : "") + '">Toman</button></div></div></header>';
    if (!m) return html + '<div class="notice">Market data is not available yet.</div>';
    var unitName = state.unit === "rial" ? "rial" : "toman";
    var ir = m.iran, wd = m.world, tse = m.tse, errs = m.errors || {};
    function findIr(key) {
      var hit = null; if (!ir) return null;
      ir.groups.forEach(function (g) { g.rows.forEach(function (r) { if (r.key === key) hit = r; }); });
      return hit;
    }
    function findW(sym) {
      var hit = null; if (!wd) return null;
      wd.groups.forEach(function (g) { g.rows.forEach(function (r) { if (r.sym === sym) hit = r; }); });
      return hit;
    }
    var kp = [], usd = findIr("usd"), eur = findIr("eur"), emami = findIr("emami1"), g18 = findIr("gol18");
    var brent = findW("ICEEUR:BRN1!"), wti = findW("NYMEX:CL1!"), gold = findW("TVC:GOLD"), spx = findW("SP:SPX");
    if (usd) kp.push(["US dollar (" + unitName + ")", irr(usd.sell), chg(usd.change, " 24h")]);
    if (eur) kp.push(["Euro (" + unitName + ")", irr(eur.sell), chg(eur.change, " 24h")]);
    if (emami) kp.push(["Emami coin (" + unitName + ")", irr(emami.sell), chg(emami.change, " 24h")]);
    if (g18) kp.push(["18k gold, gram (" + unitName + ")", irr(g18.sell), chg(g18.change, " 24h")]);
    if (tse) kp.push(["Tehran Stock Exchange", fmt(tse.tedpix, 0), chg(tse.tedpix_pct, " day")]);
    if (brent) kp.push(["Brent crude ($/bbl)", fmt(brent.price), chg(brent.change, " day")]);
    if (wti) kp.push(["WTI crude ($/bbl)", fmt(wti.price), chg(wti.change, " day")]);
    if (gold) kp.push(["Gold ($/oz)", fmt(gold.price, 0), chg(gold.change, " day")]);
    if (spx) kp.push(["S&amp;P 500", fmt(spx.price, 0), chg(spx.change, " day")]);
    html += '<div class="kpis">' + kp.map(function (k) {
      return '<div class="kpi"><div class="k">' + k[0] + '</div><div class="v">' + k[1] + '</div><div class="c">' + k[2] + "</div></div>";
    }).join("") + "</div>";

    html += sectionTitle("Tehran Stock Exchange", color("economy"));
    if (tse) {
      html += '<div class="card"><div class="tablewrap"><table><thead><tr><th>Index</th><th class="num">Value</th><th class="num">Change</th></tr></thead><tbody>' +
        '<tr><td>TEDPIX (overall index)</td><td class="num">' + fmt(tse.tedpix, 0) + '</td><td class="num">' + chg(tse.tedpix_pct) + '<span class="note">' + fmt(tse.tedpix_change, 0) + "</span></td></tr>" +
        '<tr><td>Equal-weight index</td><td class="num">' + fmt(tse.equal, 0) + '</td><td class="num">' + chg(tse.equal_pct) + "</td></tr>" +
        '<tr><td>Fara Bourse index</td><td class="num">' + fmt(tse.fara, 0) + '</td><td class="num">' + chg(tse.fara_pct) + "</td></tr>" +
        '<tr><td>Trade value</td><td class="num">' + esc(tse.trade_value) + '</td><td class="num"></td></tr>' +
        '<tr><td>Number of trades</td><td class="num">' + esc(tse.trade_number) + '</td><td class="num"></td></tr>' +
        "</tbody></table></div>" + '<div class="meta" style="margin-top:8px">tablokhani.com &middot; market ' + esc(tse.state || "") + " &middot; read " + ago(tse.fetched) +
        (errs.tablokhani ? ' &middot; <span class="err" title="' + esc(errs.tablokhani) + '">last update failed</span>' : "") + "</div></div>";
    } else html += '<div class="notice">No stock exchange data yet.</div>';

    html += sectionTitle("Iran open market", "#0f766e");
    if (ir) {
      html += '<div class="tgrid">';
      ir.groups.forEach(function (g) {
        html += '<div class="card"><h3 class="t">' + esc(g.title) + '<span class="note">in ' + unitName + '</span></h3><div class="tablewrap"><table><thead><tr><th>Name</th><th class="num">Sell</th><th class="num">Buy</th><th class="num">24h</th></tr></thead><tbody>' +
          g.rows.map(function (r) {
            return "<tr><td>" + esc(r.label) + (r.note ? '<span class="note">' + esc(r.note) + "</span>" : "") + '</td><td class="num">' + irr(r.sell) + '</td><td class="num">' + irr(r.buy) + '</td><td class="num">' + chg(r.change) + "</td></tr>";
          }).join("") + "</tbody></table></div></div>";
      });
      html += "</div>" + '<div class="meta" style="margin-top:8px">bonbast.com &middot; ' + esc(ir.updated || "") + " Tehran time" +
        (errs.bonbast ? ' &middot; <span class="err" title="' + esc(errs.bonbast) + '">last update failed</span>' : "") + "</div>";
    }

    html += sectionTitle("World markets", "#4338ca");
    if (wd) {
      html += '<div class="tgrid">' + wd.groups.map(function (g) {
        return '<div class="card"><h3 class="t">' + esc(g.title) + '</h3><div class="tablewrap"><table><thead><tr><th>Name</th><th class="num">Price</th><th class="num">Day</th></tr></thead><tbody>' +
          g.rows.map(function (r) {
            return "<tr><td>" + esc(r.label) + '</td><td class="num">' + fmt(r.price, r.price < 10 ? 4 : 2) + (r.currency && r.currency !== "USD" ? '<span class="note">' + esc(r.currency) + "</span>" : "") + '</td><td class="num">' + chg(r.change) + "</td></tr>";
          }).join("") + "</tbody></table></div></div>";
      }).join("") + "</div>" + '<div class="meta" style="margin-top:8px">TradingView &middot; read ' + ago(wd.fetched) +
        (errs.tradingview ? ' &middot; <span class="err" title="' + esc(errs.tradingview) + '">last update failed</span>' : "") + "</div>";
    }
    return html + '<p class="foot">Open-market rates come from bonbast.com; their 24h change is measured against this site\'s own reading from about a day earlier, so it appears after the first day. Stock exchange indices come from tablokhani.com. Oil is the front-month ICE Brent and NYMEX WTI futures contract via TradingView; world prices may be delayed.</p>';
  }

  // ---------- saved & sources ----------
  function renderSaved() {
    var list = Object.keys(state.saved).map(function (k) { return state.saved[k]; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var html = '<header class="ph"><div><div class="kicker" style="color:var(--star)">Your list</div><h1>Saved</h1><p>Stories you starred. They stay here even after they leave the 3-day news window.</p></div></header>';
    if (!list.length) return html + '<div class="empty">Nothing saved yet. Tap the star on any story to keep it here.</div>';
    return html + '<div class="cols2 single"><section>' + list.map(rowHtml).join("") + "</section></div>";
  }
  function renderSources() {
    var html = '<header class="ph"><div><div class="kicker" style="color:var(--muted)">Behind the news</div><h1>Sources</h1><p>Every feed this desk reads, grouped by topic, with the result of the latest update.</p></div></header>';
    TOPICS.forEach(function (t) {
      var list = state.news.sources.filter(function (s) { return s.topic === t.id; });
      html += sectionTitle(t.label, color(t.id)) + '<div class="card"><div class="tablewrap"><table><thead><tr><th>Source</th><th>Region</th><th>Status</th><th class="num">Stories</th></tr></thead><tbody>' +
        list.map(function (s) {
          return "<tr><td>" + esc(s.name) + "</td><td>" + (s.region === "iran" ? "Iran" : "World") + "</td><td>" +
            (s.ok ? '<span class="ok">OK</span>' : '<span class="err" title="' + esc(s.error) + '">Failed</span>') + '</td><td class="num">' + s.count + "</td></tr>";
        }).join("") + "</tbody></table></div></div>";
    });
    return html;
  }

  // ---------- render ----------
  function render() {
    renderSide();
    var main = document.getElementById("main");
    if (!state.news) { main.innerHTML = '<div class="empty">Loading' + ELLIPSIS + "</div>"; return; }
    var v = state.view, html;
    if (TOPIC[v]) html = renderTopic(TOPIC[v]);
    else if (v === "markets") html = renderMarkets();
    else if (v === "saved") html = renderSaved();
    else if (v === "sources") html = renderSources();
    else if (v === "events") html = renderEvents();
    else html = renderToday();
    var now = new Date();
    main.innerHTML = '<div class="datebar">' + jLabel(now) + " &middot; " + now.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" }) + "</div>" + html;
    var q = document.getElementById("q");
    if (q && render.keepFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    render.keepFocus = false;
  }

  function go(view) {
    state.view = view; state.q = ""; state.limit = { iran: PAGE, world: PAGE }; save("view", view);
    render(); window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (e) {
    var v = e.target.closest("[data-view]");
    if (v) { go(v.getAttribute("data-view")); return; }
    if (e.target.closest("#reload")) { fetchData(true); return; }
    if (e.target.closest("#theme")) {
      var cur = document.documentElement.getAttribute("data-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next); save("theme", next); return;
    }
    var s = e.target.closest("[data-star]");
    if (s) {
      e.preventDefault();
      var id = s.getAttribute("data-star");
      if (state.saved[id]) delete state.saved[id];
      else { var it = state.news.items.filter(function (x) { return x.id === id; })[0]; if (it) state.saved[id] = it; }
      save("saved", state.saved); render(); return;
    }
    var r = e.target.closest("[data-region]");
    if (r) { state.region = r.getAttribute("data-region"); save("region", state.region); render(); return; }
    var u = e.target.closest("[data-unit]");
    if (u) { state.unit = u.getAttribute("data-unit"); save("unit", state.unit); render(); return; }
    var ec = e.target.closest("[data-evcat]");
    if (ec) { state.evCat = ec.getAttribute("data-evcat"); render(); return; }
    var mo = e.target.closest("[data-more]");
    if (mo) { state.limit[mo.getAttribute("data-more")] += PAGE; render(); return; }
    var a = e.target.closest("[data-id]");
    if (a) {
      state.read[a.getAttribute("data-id")] = Date.now(); save("read", state.read);
      var card = a.closest(".story"); if (card) card.classList.add("read");
    }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "q") { state.q = e.target.value; state.limit = { iran: PAGE, world: PAGE }; render.keepFocus = true; render(); }
  });
  var savedTheme = load("theme", null);
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

  function getJson(url, bust) {
    return fetch(url + (bust ? "?t=" + Date.now() : ""), { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function fetchData(bust) {
    Promise.all([
      getJson("data/news.json", bust),
      getJson("data/digest.json", bust).catch(function () { return null; }),
      getJson("data/markets.json", bust).catch(function () { return null; }),
      getJson("data/events.json", bust).catch(function () { return null; })
    ]).then(function (res) {
      state.news = res[0]; state.digest = res[1]; state.markets = res[2]; state.events = res[3];
      var ids = {}; state.news.items.forEach(function (it) { ids[it.id] = 1; });
      Object.keys(state.read).forEach(function (k) { if (!ids[k]) delete state.read[k]; });
      save("read", state.read);
      render();
    }).catch(function () {
      if (!state.news) document.getElementById("main").innerHTML = '<div class="empty">Could not load the news. Check your connection and reload.</div>';
    });
  }

  render();
  fetchData(false);
  window.addEventListener("pagehide", function () { save("lastVisit", thisVisit); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") save("lastVisit", thisVisit); });
  // no service worker on localhost, so local edits show up on reload
  if ("serviceWorker" in navigator && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
