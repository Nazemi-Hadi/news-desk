name: Update news and markets

on:
  schedule:
    - cron: "30 3 * * *"     # 07:00 Tehran - news + daily brief
    - cron: "0 */3 * * *"    # every 3 hours - news + markets
    - cron: "15 * * * *"     # every hour - markets only
  workflow_dispatch:
    inputs:
      brief:
        description: "Also write the daily brief"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch market prices
        run: python scripts/fetch_markets.py
      - name: Fetch feeds
        if: github.event.schedule != '15 * * * *'
        run: python scripts/fetch_news.py
      - name: Write daily brief
        if: github.event.schedule == '30 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.brief)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/make_digest.py
      - name: Commit data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet && git push
